<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Parkour Lobby & Editor</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a24;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin: 0 0 10px 0; font-size: 22px; text-shadow: 2px 2px #000; color: #ffbc00; }
        canvas {
            border: 4px solid #3a3a50;
            background-color: #282c34;
            image-rendering: pixelated;
        }
        /* Giao diện bảng vẽ Pixel bên cạnh */
        .editor-panel {
            background: #252833;
            border: 4px solid #3a3a50;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 4px;
        }
        .pixel-grid {
            display: grid;
            grid-template-columns: repeat(16, 15px);
            grid-template-rows: repeat(16, 15px);
            gap: 1px;
            background: #111;
            padding: 2px;
            border: 2px solid #555;
        }
        .pixel-cell {
            width: 15px;
            height: 15px;
            background-color: #fff;
            cursor: pointer;
        }
        .palette {
            display: flex;
            gap: 5px;
            margin: 10px 0;
        }
        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            cursor: pointer;
            border: 2px solid #fff;
        }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px #c02c39;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .controls { margin-top: 10px; font-size: 12px; color: #a0a0c0; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="gameStatus">ĐANG Ở MÀN HÌNH CHỜ (LOBBY)</h1>
        <canvas id="gameCanvas" width="700" height="400"></canvas>
        <div class="controls">
            <b>A, D</b>: Chạy | <b>W / SPACE</b>: Nhảy & Nhảy Tường <br>
            <i>Mẹo: Trong sảnh chờ, cậu vẫn có thể nhảy nhót parkour thoải mái!</i>
        </div>
    </div>

    <div class="editor-panel">
        <h3 style="margin: 0 0 10px 0; font-size: 14px; color: #00ffcc;">VẼ ÁO NHÂN VẬT (16x16)</h3>
        <div class="pixel-grid" id="pixelGrid"></div>
        
        <div class="palette">
            <div class="color-dot" style="background: #ff4757;" onclick="setCurrentColor('#ff4757')"></div>
            <div class="color-dot" style="background: #2ed573;" onclick="setCurrentColor('#2ed573')"></div>
            <div class="color-dot" style="background: #1e90ff;" onclick="setCurrentColor('#1e90ff')"></div>
            <div class="color-dot" style="background: #ffa500;" onclick="setCurrentColor('#ffa500')"></div>
            <div class="color-dot" style="background: #ffffff;" onclick="setCurrentColor('#ffffff')"></div>
            <div class="color-dot" style="background: #2f3542;" onclick="setCurrentColor('#2f3542')"></div>
        </div>

        <button class="btn" onclick="applySkin()">Mặc Áo Này</button>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Trạng thái game: "LOBBY" (Chờ) hoặc "GAMEPLAY" (Đang đấu)
let gameState = "LOBBY"; 
let lobbyTimer = 10; // 10 giây đếm ngược để bắt đầu trận
let timerInterval;

const GRAVITY = 0.4;
const KEYS = {};

// Khởi tạo người chơi
const player = {
    x: 100, y: 300, width: 24, height: 32, vx: 0, vy: 0,
    speed: 4.5, jumpForce: 9, isGrounded: false, isOnWall: false, wallDir: 0
};

// Khởi tạo bộ nhớ skin (Mặc định là áo màu đỏ #ff4757 phủ đầy mảng 16x16)
let playerSkin = Array(16).fill().map(() => Array(16).fill("#ff4757"));
let currentColor = "#ff4757";

// Địa hình map sảnh chờ
const platforms = [
    { x: 0, y: 370, width: 700, height: 30 },
    { x: 250, y: 270, width: 200, height: 15 },
    { x: 80, y: 190, width: 100, height: 15 },
    { x: 520, y: 190, width: 100, height: 15 },
    { x: 0, y: 0, width: 20, height: 400 }, // Tường trái để bám đuôi parkour
    { x: 680, y: 0, width: 20, height: 400 } // Tường phải
];

// --- KHU VỰC XỬ LÝ BẢNG VẼ PIXEL ---
const gridContainer = document.getElementById("pixelGrid");
for (let r = 0; r < 16; r++) {
    for (let c = 0; c < 16; c++) {
        const cell = document.createElement("div");
        cell.classList.add("pixel-cell");
        cell.style.backgroundColor = "#ff4757"; // Áo đỏ mặc định
        cell.addEventListener("click", () => {
            cell.style.backgroundColor = currentColor;
            playerSkin[r][c] = currentColor;
        });
        gridContainer.appendChild(cell);
    }
}
function setCurrentColor(color) { currentColor = color; }
function applySkin() { alert("Đã áp dụng trang phục pixel tự vẽ lên nhân vật!"); }

// --- HỆ THỐNG ĐẾM NGƯỢC LOBBY ---
function startLobbyTimer() {
    timerInterval = setInterval(() => {
        if (gameState === "LOBBY") {
            lobbyTimer--;
            document.getElementById("gameStatus").innerText = `TRẬN ĐẤU BẮT ĐẦU SAU: ${lobbyTimer}s (LOBBY)`;
            
            if (lobbyTimer <= 0) {
                gameState = "GAMEPLAY";
                document.getElementById("gameStatus").innerText = "💥 TRẬN ĐẤU BẮT ĐẦU! HÃY TIÊU DIỆT NHAU! 💥";
                document.getElementById("gameStatus").style.color = "#ff4757";
                clearInterval(timerInterval);
            }
        }
    }, 1000);
}
startLobbyTimer();

// --- VẬT LÝ VÀ DI CHUYỂN PARKOUR ---
window.addEventListener("keydown", (e) => KEYS[e.code] = true);
window.addEventListener("keyup", (e) => KEYS[e.code] = false);

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y;
}

function update() {
    if (KEYS["KeyA"] || KEYS["ArrowLeft"]) player.vx = -player.speed;
    else if (KEYS["KeyD"] || KEYS["ArrowRight"]) player.vx = player.speed;
    else player.vx = 0;

    player.vy += GRAVITY;
    if (player.isOnWall && player.vy > 1) player.vy = 0.8; // Giảm tốc độ rơi khi bám tường

    player.x += player.vx;
    player.isOnWall = false; player.wallDir = 0;
    
    for (let plat of platforms) {
        if (checkCollision(player, plat)) {
            if (player.vx > 0) { player.x = plat.x - player.width; if (!player.isGrounded) { player.isOnWall = true; player.wallDir = 1; } }
            if (player.vx < 0) { player.x = plat.x + plat.width; if (!player.isGrounded) { player.isOnWall = true; player.wallDir = -1; } }
        }
    }

    player.y += player.vy; player.isGrounded = false;
    for (let plat of platforms) {
        if (checkCollision(player, plat)) {
            if (player.vy > 0) { player.y = plat.y - player.height; player.vy = 0; player.isGrounded = true; }
            if (player.vy < 0) { player.y = plat.y + plat.height; player.vy = 0; }
        }
    }

    if ((KEYS["KeyW"] || KEYS["Space"] || KEYS["ArrowUp"])) {
        if (player.isGrounded) { player.vy = -player.jumpForce; player.isGrounded = false; }
        else if (player.isOnWall) {
            player.vy = -player.jumpForce * 0.9;
            player.vx = -player.wallDir * player.speed * 1.4;
            player.x += player.vx; player.isOnWall = false;
        }
    }
}

// --- VẼ ĐỒ HỌA (RENDER) ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ nền background phân biệt chế độ chơi
    ctx.fillStyle = gameState === "LOBBY" ? "#1d212a" : "#2d1b1b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Vẽ địa hình (Bản đồ)
    ctx.fillStyle = gameState === "LOBBY" ? "#4a4e69" : "#721c24";
    for (let plat of platforms) {
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
    }

    // VẼ NHÂN VẬT DỰA TRÊN MA TRẬN 16x16 TỰ VẼ
    const pixelW = player.width / 16;
    const pixelH = player.height / 16;

    for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 16; c++) {
            ctx.fillStyle = playerSkin[r][c];
            ctx.fillRect(player.x + (c * pixelW), player.y + (r * pixelH), pixelW + 0.5, pixelH + 0.5);
        }
    }

    // Vẽ thêm đôi mắt lên trên trang phục để biết hướng đi
    ctx.fillStyle = "#ffffff";
    let eyeX = player.vx >= 0 ? player.x + 16 : player.x + 4;
    ctx.fillRect(eyeX, player.y + 6, 5, 5);
    ctx.fillStyle = "#000";
    ctx.fillRect(player.x + 10, player.y + 14, 4, 2); // Cái miệng nhỏ tinh nghịch
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
