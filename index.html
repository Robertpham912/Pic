<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Parkour Prototype</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a24;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            text-shadow: 2px 2px #000;
        }
        canvas {
            border: 4px solid #3a3a50;
            background-color: #282c34;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.5);
            image-rendering: pixelated; /* Giữ nét pixel retro */
        }
        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #a0a0c0;
        }
    </style>
</head>
<body>

    <h1>RETRO PARKOUR PROTOTYPE</h1>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div class="controls">
        Điều khiển: <b>A, D</b> - Di chuyển | <b>W hoặc SPACE</b> - Nhảy | <b>Bám tường + Nhảy</b> - Nhảy tường (Wall Jump)
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Cấu hình vật lý cơ bản
const GRAVITY = 0.5;
const KEYS = {};

// Khởi tạo người chơi (Khối vuông đại diện trước khi vẽ nhân vật)
const player = {
    x: 100,
    y: 300,
    width: 20,
    height: 30,
    vx: 0,
    vy: 0,
    speed: 5,
    jumpForce: 10,
    isGrounded: false,
    isOnWall: false,
    wallDir: 0 // -1: tường bên trái, 1: tường bên phải
};

// Định nghĩa bản đồ thử nghiệm (Hệ thống các khối gạch - Bản mẫu của vẽ Map sau này)
const platforms = [
    { x: 0, y: 420, width: 800, height: 30 }, // Mặt đất chính
    { x: 200, y: 320, width: 120, height: 20 }, // Bậc nhảy 1
    { x: 400, y: 240, width: 150, height: 20 }, // Bậc nhảy 2
    { x: 650, y: 160, width: 100, height: 20 }, // Bậc nhảy 3
    { x: 50, y: 180, width: 30, height: 240 },  // Cột tường trái để test Wall Jump
    { x: 600, y: 280, width: 30, height: 140 }   // Cột tường phải
];

// Lắng nghe sự kiện bàn phím
window.addEventListener("keydown", (e) => KEYS[e.code] = true);
window.addEventListener("keyup", (e) => KEYS[e.code] = false);

// Hàm kiểm tra va chạm (AABB Collision)
function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

// Cập nhật trạng thái game hàng khung hình
function update() {
    // 1. Di chuyển ngang
    if (KEYS["KeyA"] || KEYS["ArrowLeft"]) player.vx = -player.speed;
    else if (KEYS["KeyD"] || KEYS["ArrowRight"]) player.vx = player.speed;
    else player.vx = 0;

    // Trọng lực tác động
    player.vy += GRAVITY;

    // Giới hạn tốc độ rơi khi bám tường (Tạo cảm giác trượt tường retro)
    if (player.isOnWall && player.vy > 1) {
        player.vy = 1; // Trượt xuống từ từ
    }

    // Áp dụng vận tốc vào vị trí tạm thời
    player.x += player.vx;
    
    // Xử lý va chạm theo trục X (Tường)
    player.isOnWall = false;
    player.wallDir = 0;
    
    for (let plat of platforms) {
        if (checkCollision(player, plat)) {
            if (player.vx > 0) { // Đang đi sang phải đập vào tường
                player.x = plat.x - player.width;
                if (!player.isGrounded) { player.isOnWall = true; player.wallDir = 1; }
            }
            if (player.vx < 0) { // Đang đi sang trái đập vào tường
                player.x = plat.x + plat.width;
                if (!player.isGrounded) { player.isOnWall = true; player.wallDir = -1; }
            }
        }
    }

    player.y += player.vy;
    player.isGrounded = false;

    // Xử lý va chạm theo trục Y (Đất/Trần nhà)
    for (let plat of platforms) {
        if (checkCollision(player, plat)) {
            if (player.vy > 0) { // Đang rơi xuống đất
                player.y = plat.y - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }
            if (player.vy < 0) { // Đang nhảy đụng trần
                player.y = plat.y + plat.height;
                player.vy = 0;
            }
        }
    }

    // 2. Xử lý Nhảy và Nhảy Tường (Parkour)
    if ((KEYS["KeyW"] || KEYS["Space"] || KEYS["ArrowUp"])) {
        if (player.isGrounded) {
            // Nhảy bình thường từ mặt đất
            player.vy = -player.jumpForce;
            player.isGrounded = false;
        } else if (player.isOnWall) {
            // WALL JUMP: Đẩy người chơi ra hướng ngược lại của tường
            player.vy = -player.jumpForce * 0.9;
            player.vx = -player.wallDir * player.speed * 1.5;
            player.x += player.vx; // Tạo lực đẩy ra xa tường ngay lập tức
            player.isOnWall = false;
        }
    }
}

// Vẽ đồ họa lên màn hình canvas
function draw() {
    // Xóa màn hình cũ
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ các khối nền tảng (Bản đồ)
    ctx.fillStyle = "#4e54c8";
    for (let plat of platforms) {
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        // Vẽ thêm viền trên để nhìn rõ khối retro
        ctx.fillStyle = "#8f94fb";
        ctx.fillRect(plat.x, plat.y, plat.width, 4);
        ctx.fillStyle = "#4e54c8";
    }

    // Vẽ người chơi (Màu đỏ năng động)
    ctx.fillStyle = player.isOnWall ? "#ff6b6b" : "#ff4757"; // Đổi màu nhẹ khi đang bám tường
    ctx.fillRect(player.x, player.y, player.width, player.height);
    
    // Vẽ mắt cho nhân vật vuông nhìn cho dễ thương và biết hướng quay mặt
    ctx.fillStyle = "#ffffff";
    let eyeOffset = player.vx >= 0 ? 12 : 2;
    if (player.vx === 0 && player.isOnWall) eyeOffset = player.wallDir === 1 ? 12 : 2;
    ctx.fillRect(player.x + eyeOffset, player.y + 6, 6, 6);
}

// Vòng lặp game cốt lõi (Game Loop)
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Kích hoạt game chạy
gameLoop();
</script>

</body>
</html>
